<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספריית השיעורים - בית מנחם</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1e293b;background:#f8fafc}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:32px 16px 60px}h1{text-align:center;font-size:clamp(25px,4vw,38px);margin:12px 0 8px}.subtitle{text-align:center;color:#64748b;margin:0 0 30px}.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:12px;margin:0 0 28px;align-items:end}.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff;color:#1e293b;min-width:0}.field input:focus-visible,.field select:focus-visible,.thumb:focus-visible,#load:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}.card{min-width:0;background:#fff;border:1px solid #e2e8f0;border-radius:17px;overflow:hidden;box-shadow:0 3px 12px #0f172a0a;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;display:flex;flex-direction:column}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0f172a18;border-color:#cbd5e1}.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#0f172a;border:0;padding:0;cursor:pointer;display:block;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}.card:hover .thumb img{transform:scale(1.035)}.thumb:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0004);pointer-events:none}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#ffffffed;color:#173b61;box-shadow:0 5px 20px #0005;font-size:23px;padding-inline-start:3px;z-index:1;transition:transform .2s ease,background .2s ease}.thumb:hover .play{transform:translate(-50%,-50%) scale(1.1);background:#fff}.card-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:11px;flex:1}.card h2{font-size:16px;line-height:1.55;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3.1em}.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.series-tag{display:inline-flex;max-width:100%;font-size:12px;font-weight:600;color:#244b73;background:#eaf2fa;border-radius:7px;padding:5px 9px;overflow-wrap:anywhere}.speaker-name{display:flex;align-items:center;gap:7px;font-size:13px;color:#64748b;line-height:1.5;overflow-wrap:anywhere}.speaker-icon{font-size:15px;flex:none}.card-footer{border-top:1px solid #f1f5f9;padding-top:11px;margin-top:auto;color:#64748b;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.watch-label{color:#244b73;font-weight:700}.player{width:100%;aspect-ratio:16/9;border:0;display:block}#load{display:block;margin:30px auto;padding:12px 24px;background:#183b63;color:white;border:0;border-radius:9px;cursor:pointer;font-size:16px}#load[hidden]{display:none}#status{text-align:center;color:#64748b;padding:15px}@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.field-search{grid-column:1/-1}}@media(max-width:460px){main{padding:22px 14px 45px}.filters{grid-template-columns:1fr}.field-search{grid-column:auto}.grid{grid-template-columns:1fr;gap:16px}}@media(prefers-reduced-motion:reduce){.card,.thumb img,.play{transition:none}.card:hover{transform:none}.card:hover .thumb img{transform:none}}
</style></head>
<body><main><h1>ספריית השיעורים - בית מנחם</h1><p class="subtitle">שיעורים והתוועדויות בבית מדרשינו</p>
<div class="filters">
<div class="field field-search"><label for="search">חיפוש שיעורים</label><input id="search" type="search" placeholder="חיפוש לפי שם השיעור או מילת מפתח…"></div>
<div class="field"><label for="speaker">מגיד שיעור</label><select id="speaker"><option value="">כל מגידי השיעורים</option></select></div>
<div class="field"><label for="topic">סדרת שיעורים</label><select id="topic"><option value="">כל הסדרות</option></select></div>
<div class="field"><label for="sort">מיון לפי</label><select id="sort"><option value="new">מהחדש לישן</option><option value="old">מהישן לחדש</option><option value="az">לפי כותרת</option></select></div>
</div><div id="grid" class="grid"></div><p id="status" role="status">טוען שיעורים…</p><button id="load" hidden>טען שיעורים נוספים</button></main>
<script>
// Public video metadata is generated by GitHub Actions; API credentials are not used here.
const grid=document.getElementById('grid'),search=document.getElementById('search'),status=document.getElementById('status'),load=document.getElementById('load'),speaker=document.getElementById('speaker'),topic=document.getElementById('topic'),sort=document.getElementById('sort');
let videos=[],visible=24;
const clean=s=>typeof s==='string'?s.trim():'';
const norm=s=>clean(s).toLocaleLowerCase('he').replace(/[\u05f3\u05f4׳״'"`]/g,'').replace(/[־–—-]/g,' ').replace(/\s+/g,' ').trim();
const knownSpeakers=[
 ['הרב יעקב פרץ בלומינג',/יעקב\s+(?:פרץ\s+)?בלומינג/],
 ['הרב לייבל אלטיין',/לייבל\s+אלטיין/],
 ['הרב שמואל שור',/שמואל\s+שור/],
 ['הרב יוסף קליין',/יוסף\s+קליין/],
 ['הרב יוסף יצחק גורארי׳',/יוסף\s+יצחק\s+גורארי/],
 ['הרב יוסף יצחק פלטיאל',/יוסף\s+יצחק\s+פלטיאל/],
 ['הרב לימא וליהלם',/לימא\s+וליהלם/],
 ['הרב שלום חאריטאנאוו',/שלום\s+חאריטאנאוו/]
];
const UNKNOWN_SPEAKER='לא צוין מגיד שיעור';
// Names explicitly supplied in titles or metadata are discovered automatically.
// Keep known aliases first, so spelling variants merge into one rabbi.
function canonicalSpeaker(s){
 const n=norm(s);
 for(const [name,re] of knownSpeakers)if(re.test(n))return name;
 const stripped=clean(s).replace(/^(?:(?:מפי|ע״י|על ידי)\s+)?(?:הרה״ג|הרה״ח|הרב|רבי|רב|ר['׳״\u05f3\u05f4]?)\s+/u,'').trim();
 const words=stripped.split(/\s+/).filter(Boolean);
 if(words.length<2||words.length>5)return UNKNOWN_SPEAKER;
 return 'הרב '+stripped;
}
function extractLabeledSpeaker(title){
 // Match only explicit speaker labels. Stop at separators or common title context.
 const sections=title.split(/\s*(?:\||[–—]|\s[-]\s|[;]|\n)\s*/u);
 const marker=/(?:^|\s)(?:(?:מפי|ע״י|על ידי)\s+)?(?:הרה״ג|הרה״ח|הרב|רבי|רב|ר['׳״\u05f3\u05f4]?)\s+([\u05d0-\u05ea][\u05d0-\u05ea'׳״\u05f3\u05f4\s-]*)/u;
 const stop=/\s+(?:שליט[״']?א|זצ[״']?ל|בנושא|בעניין|על|בשיעור|בשיחת|בפרשת|פרשת|שיעור|התוועדות|יום|ליל|מוצאי|תאריך|תש[\u05d0-\u05ea]+)\b/u;
 for(const section of sections){
  const m=section.match(marker);if(!m)continue;
  const tail=m[1].split(stop)[0].trim();
  const words=tail.split(/\s+/).filter(Boolean);
  if(words.length>=2&&words.length<=5)return canonicalSpeaker(tail);
 }
 return UNKNOWN_SPEAKER;
}
function getSpeaker(v){
 if(clean(v.speaker))return clean(v.speaker); // Explicit Google Sheets override
 for(const field of [v.rabbi,v.maggid_shiur])if(clean(field)){
  const candidate=canonicalSpeaker(field);if(candidate!==UNKNOWN_SPEAKER)return candidate;
 }
 const title=clean(v.title),n=norm(title);
 // Confirmed series-to-speaker association, including future uploads.
 if(/רמבם\s+לעיונא/u.test(n))return 'הרב יעקב פרץ בלומינג';
 for(const [name,re] of knownSpeakers)if(re.test(n))return name;
 return extractLabeledSpeaker(title);
}
// A comma, Hebrew comma, semicolon, or line break separates co-presenters.
// Manual names are kept as entered in Google Sheets.
function getSpeakers(v){
 const raw=getSpeaker(v);
 const names=raw.split(/[,،;؛\n]+/u).map(clean).filter(Boolean);
 return [...new Set(names.length?names:[UNKNOWN_SPEAKER])];
}
const seriesRules=[
 ['היום יום',/היום\s+יום/],['דרך מצוותיך',/דרך\s+מצוותיך/],['לקוטי שיחות',/(?:לקוטי|ליקוטי)\s+שיחות/],['רמב״ם לעיונא',/רמב["״׳']?ם\s+לעיונא/u],['ספר השיחות',/ספר\s+השיחות/],['תניא',/תניא/],['מאמרים',/מאמר(?:ים)?\b/],['התוועדויות',/התוועדות|התוועדויות/],['פרשת השבוע',/פרשת|פרשה/]
];
function getSeries(v){if(clean(v.series))return clean(v.series);if(clean(v.topic))return clean(v.topic);for(const [name,re] of seriesRules)if(re.test(v.title))return name;return 'שיעורים נוספים'}
function fillOptions(el,values){for(const value of [...new Set(values)].sort((a,b)=>a.localeCompare(b,'he'))){const opt=document.createElement('option');opt.value=value;opt.textContent=value;el.append(opt)}}
function render(){
 const q=norm(search.value);
 const matched=videos.filter(v=>(!q||norm(v.title+' '+v._speakers.join(' ')+' '+v._series).includes(q))&&(!speaker.value||v._speakers.includes(speaker.value))&&(!topic.value||v._series===topic.value));
 if(sort.value==='old')matched.reverse();else if(sort.value==='az')matched.sort((a,b)=>a.title.localeCompare(b.title,'he'));
 grid.replaceChildren();
 for(const v of matched.slice(0,visible)){
  const card=document.createElement('article');card.className='card';
  const btn=document.createElement('button');btn.className='thumb';btn.type='button';btn.setAttribute('aria-label','נגן '+v.title);
  const img=document.createElement('img');img.loading='lazy';img.alt='';img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';
  const play=document.createElement('span');play.className='play';play.setAttribute('aria-hidden','true');play.textContent='▶';btn.append(img,play);
  btn.addEventListener('click',()=>{const iframe=document.createElement('iframe');iframe.className='player';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1';iframe.title=v.title;iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;btn.replaceWith(iframe)});
  const body=document.createElement('div');body.className='card-body';
  if(v._series&&v._series!=='שיעורים נוספים'){const meta=document.createElement('div');meta.className='card-meta';const tag=document.createElement('span');tag.className='series-tag';tag.textContent=v._series;meta.append(tag);body.append(meta)}
  const h=document.createElement('h2');h.textContent=v.title;h.title=v.title;body.append(h);
  if(v._speakers.some(name=>name!==UNKNOWN_SPEAKER)){const speakerRow=document.createElement('div');speakerRow.className='speaker-name';const icon=document.createElement('span');icon.className='speaker-icon';icon.setAttribute('aria-hidden','true');icon.textContent='♙';const name=document.createElement('span');name.textContent=v._speakers.join(' · ');speakerRow.append(icon,name);body.append(speakerRow)}
  const footer=document.createElement('div');footer.className='card-footer';const institution=document.createElement('span');institution.textContent='בית מנחם ליובאוויטש';const watch=document.createElement('span');watch.className='watch-label';watch.textContent='לצפייה בשיעור ◀';footer.append(institution,watch);body.append(footer);
  card.append(btn,body);grid.append(card);
 }
 load.hidden=matched.length<=visible;status.textContent=matched.length?`${Math.min(visible,matched.length)} מתוך ${matched.length} שיעורים`:'לא נמצאו שיעורים מתאימים';
}
for(const el of [search,speaker,topic,sort])el.addEventListener(el===search?'input':'change',()=>{visible=24;render()});load.addEventListener('click',()=>{visible+=24;render()});
fetch('./videos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Video index not available');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid video index');videos=data.filter(v=>v&&v.hidden!==true&&typeof v.id==='string'&&/^[\w-]{11}$/.test(v.id)&&typeof v.title==='string').map(v=>({...v,_speakers:getSpeakers(v),_series:getSeries(v)}));fillOptions(speaker,videos.flatMap(v=>v._speakers));fillOptions(topic,videos.map(v=>v._series));render()}).catch(()=>{status.textContent='לא ניתן לטעון את ספריית השיעורים כעת.'});
</script></body></html>
