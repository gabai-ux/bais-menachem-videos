<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bais Menachem Video Library</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1e293b;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:clamp(25px,4vw,38px);margin:12px 0 8px}.subtitle{text-align:center;color:#64748b;margin:0 0 25px}input{display:block;width:100%;max-width:520px;margin:0 auto 26px;padding:13px 16px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #0000000a}.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#0f172a;border:0;padding:0;cursor:pointer;display:block}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;background:#d00;color:#fff;font-size:23px;padding:9px 18px}.card h2{font-size:16px;line-height:1.5;margin:12px 14px 16px;overflow-wrap:anywhere}.player{width:100%;aspect-ratio:16/9;border:0}#load{display:block;margin:28px auto;padding:12px 24px;background:#183b63;color:white;border:0;border-radius:8px;cursor:pointer;font-size:16px}#load[hidden]{display:none}#status{text-align:center;color:#64748b;padding:12px}
</style>
</head>
<body><main><h1>Bais Menachem Video Library</h1><p class="subtitle" lang="he" dir="rtl">שיעורים והתוועדויות בבית מדרשינו</p><input id="search" type="search" placeholder="Search shiurim by title…" aria-label="Search shiurim by title"><div id="grid" class="grid"></div><p id="status" role="status">Loading videos…</p><button id="load" hidden>Load More Videos</button></main>
<script>
// Public video metadata is generated by a scheduled GitHub Action.
// The YouTube API key belongs in GitHub Actions secrets, never in this file.
const grid=document.getElementById('grid'),search=document.getElementById('search'),status=document.getElementById('status'),load=document.getElementById('load');
let videos=[],visible=24;
function render(){const q=search.value.trim().toLocaleLowerCase();const matched=videos.filter(v=>v.title.toLocaleLowerCase().includes(q));grid.replaceChildren();for(const v of matched.slice(0,visible)){const card=document.createElement('article');card.className='card';const btn=document.createElement('button');btn.className='thumb';btn.setAttribute('aria-label','Play '+v.title);const img=document.createElement('img');img.loading='lazy';img.alt='';img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';const play=document.createElement('span');play.className='play';play.textContent='▶';btn.append(img,play);btn.addEventListener('click',()=>{const iframe=document.createElement('iframe');iframe.className='player';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1';iframe.title=v.title;iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;btn.replaceWith(iframe)});const h=document.createElement('h2');h.textContent=v.title;card.append(btn,h);grid.append(card)}load.hidden=matched.length<=visible;status.textContent=matched.length?`${Math.min(visible,matched.length)} of ${matched.length} videos`:'No matching videos found.'}
search.addEventListener('input',()=>{visible=24;render()});load.addEventListener('click',()=>{visible+=24;render()});
fetch('./videos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Video index not available');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid video index');videos=data.filter(v=>typeof v.id==='string'&&/^[\w-]{11}$/.test(v.id)&&typeof v.title==='string');render()}).catch(()=>{status.textContent='Video library is being set up. Please check back soon.'});
</script></body></html>
