<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bais Menachem Video Library</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1e293b;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:clamp(25px,4vw,38px);margin:12px 0 8px}.subtitle{text-align:center;color:#64748b;margin:0 0 25px}.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:12px;margin:0 0 26px;align-items:end}.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff;color:#1e293b;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #0000000a}.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#0f172a;border:0;padding:0;cursor:pointer;display:block}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;background:#d00;color:#fff;font-size:23px;padding:9px 18px}.card h2{font-size:16px;line-height:1.5;margin:12px 14px 16px;overflow-wrap:anywhere}.player{width:100%;aspect-ratio:16/9;border:0}#load{display:block;margin:28px auto;padding:12px 24px;background:#183b63;color:white;border:0;border-radius:8px;cursor:pointer;font-size:16px}#load[hidden]{display:none}#status{text-align:center;color:#64748b;padding:12px}@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.field-search{grid-column:1/-1}}@media(max-width:460px){.filters{grid-template-columns:1fr}.field-search{grid-column:auto}}
</style>
</head>
<body><main><h1>Bais Menachem Video Library</h1><p class="subtitle" lang="he" dir="rtl">שיעורים והתוועדויות בבית מדרשינו</p>
<div class="filters">
<div class="field field-search"><label for="search">Search shiurim</label><input id="search" type="search" placeholder="Search by title or keyword…"></div>
<div class="field"><label for="speaker">Maggid Shiur</label><select id="speaker"><option value="">All Rabbanim</option></select></div>
<div class="field"><label for="topic">Topic</label><select id="topic"><option value="">All Topics</option></select></div>
<div class="field"><label for="sort">Sort by</label><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A–Z</option></select></div>
</div><div id="grid" class="grid"></div><p id="status" role="status">Loading videos…</p><button id="load" hidden>Load More Videos</button></main>
<script>
// Public metadata comes from videos.json; no YouTube API key is exposed here.
const grid=document.getElementById('grid'),search=document.getElementById('search'),status=document.getElementById('status'),load=document.getElementById('load'),speaker=document.getElementById('speaker'),topic=document.getElementById('topic'),sort=document.getElementById('sort');
let videos=[],visible=24;
const clean=s=>typeof s==='string'?s.trim():'';
const normalize=s=>s.toLocaleLowerCase();
// Conservative topic detection based on explicit words in the title.
const topicRules=[
 ['Farbrengen',/(?:farbrengen|farbreng|התוועדות|התוועדויות)/i],
 ['Parsha',/(?:parsha|parshas|parshat|פרשת|פרשה|פרשיות)/i],
 ['Yom Tov',/(?:yom tov|yomtov|יום טוב|חג|פסח|סוכות|שבועות|ראש השנה|יום כיפור|חנוכה|פורים|chanuk|purim|pesach|sukkos|sukkot|shavuos|shavuot|rosh hashana)/i],
 ['Chassidus',/(?:chassidus|chasidus|chassidut|חסידות|חסידישע|תניא|tanya|maamar|מאמר|לקוטי תורה|תורה אור)/i]
];
function getTopic(v){const explicit=clean(v.topic);if(explicit)return explicit;for(const [name,pattern] of topicRules){if(pattern.test(v.title))return name}return 'Other / Unclassified'}
// Prefer explicit metadata; never guess a rabbi from arbitrary title words.
function getSpeaker(v){return clean(v.speaker)||clean(v.rabbi)||clean(v.maggid_shiur)||'Not specified'}
function fillOptions(el,values){for(const value of [...new Set(values)].sort((a,b)=>a.localeCompare(b))){const opt=document.createElement('option');opt.value=value;opt.textContent=value;el.append(opt)}}
function render(){const q=normalize(search.value.trim());const matched=videos.filter(v=>(!q||normalize(v.title+' '+getSpeaker(v)+' '+getTopic(v)).includes(q))&&(!speaker.value||getSpeaker(v)===speaker.value)&&(!topic.value||getTopic(v)===topic.value));if(sort.value==='old')matched.reverse();else if(sort.value==='az')matched.sort((a,b)=>a.title.localeCompare(b.title));grid.replaceChildren();for(const v of matched.slice(0,visible)){const card=document.createElement('article');card.className='card';const btn=document.createElement('button');btn.className='thumb';btn.setAttribute('aria-label','Play '+v.title);const img=document.createElement('img');img.loading='lazy';img.alt='';img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';const play=document.createElement('span');play.className='play';play.textContent='▶';btn.append(img,play);btn.addEventListener('click',()=>{const iframe=document.createElement('iframe');iframe.className='player';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1';iframe.title=v.title;iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;btn.replaceWith(iframe)});const h=document.createElement('h2');h.textContent=v.title;card.append(btn,h);grid.append(card)}load.hidden=matched.length<=visible;status.textContent=matched.length?`${Math.min(visible,matched.length)} of ${matched.length} videos`:'No matching videos found.'}
for(const el of [search,speaker,topic,sort])el.addEventListener(el===search?'input':'change',()=>{visible=24;render()});load.addEventListener('click',()=>{visible+=24;render()});
fetch('./videos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Video index not available');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid video index');videos=data.filter(v=>v&&typeof v.id==='string'&&/^[\w-]{11}$/.test(v.id)&&typeof v.title==='string');fillOptions(speaker,videos.map(getSpeaker));fillOptions(topic,videos.map(getTopic));render()}).catch(()=>{status.textContent='Video library is being set up. Please check back soon.'});
</script></body></html>
