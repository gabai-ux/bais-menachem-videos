<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספריית השיעורים | בית מנחם</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1e293b;background:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:clamp(25px,4vw,38px);margin:12px 0 8px}.subtitle{text-align:center;color:#64748b;margin:0 0 25px}.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:12px;margin:0 0 26px;align-items:end}.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff;color:#1e293b;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #0000000a}.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#0f172a;border:0;padding:0;cursor:pointer;display:block}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;background:#d00;color:#fff;font-size:23px;padding:9px 18px}.card h2{font-size:16px;line-height:1.5;margin:12px 14px 16px;overflow-wrap:anywhere}.player{width:100%;aspect-ratio:16/9;border:0}#load{display:block;margin:28px auto;padding:12px 24px;background:#183b63;color:white;border:0;border-radius:8px;cursor:pointer;font-size:16px}#load[hidden]{display:none}#status{text-align:center;color:#64748b;padding:12px}@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.field-search{grid-column:1/-1}}@media(max-width:460px){.filters{grid-template-columns:1fr}.field-search{grid-column:auto}}
</style>
</head>
<body><main><h1>ספריית השיעורים – בית מנחם</h1><p class="subtitle">שיעורים והתוועדויות בבית מדרשינו</p>
<div class="filters">
<div class="field field-search"><label for="search">חיפוש שיעורים</label><input id="search" type="search" placeholder="חיפוש לפי שם השיעור או מילת מפתח…"></div>
<div class="field"><label for="speaker">מגיד שיעור</label><select id="speaker"><option value="">כל מגידי השיעורים</option></select></div>
<div class="field"><label for="series">סדרת שיעורים</label><select id="series"><option value="">כל הסדרות</option></select></div>
<div class="field"><label for="sort">מיון לפי</label><select id="sort"><option value="new">מהחדש לישן</option><option value="old">מהישן לחדש</option><option value="az">לפי שם השיעור</option></select></div>
</div><div id="grid" class="grid"></div><p id="status" role="status">טוען שיעורים…</p><button id="load" hidden>טען שיעורים נוספים</button></main>
<script>
// videos.json is public metadata. Never put a YouTube API key in this file.
const grid=document.getElementById('grid'),search=document.getElementById('search'),status=document.getElementById('status'),load=document.getElementById('load'),speaker=document.getElementById('speaker'),series=document.getElementById('series'),sort=document.getElementById('sort');
let videos=[],visible=24;
const clean=s=>typeof s==='string'?s.trim():'';
const normalize=s=>clean(s).toLocaleLowerCase('he').replace(/[״“”"׳']/g,'').replace(/\s+/g,' ');
const seriesRules=[
 ['היום יום',/היום\s*יום/i],['דרך מצוותיך',/דרך\s*מצוותיך/i],['לקוטי שיחות',/(?:לקוטי|ליקוטי)\s*שיחות/i],['רמב״ם לעיונא',/רמב["״]?ם\s*לעיונא/i],['ספר השיחות',/ספר\s*השיחות/i],['תניא',/תניא/i],['מאמרים',/מאמר(?:ים)?\b/i],['התוועדויות',/התוועדות|התוועדויות|farbrengen/i],['פרשת השבוע',/פרשת\s|parsha/i]
];
const speakerRules=[
 ['הרב יעקב פרץ בלומינג',/(?:יעקב\s+(?:פרץ\s+)?בלומינג)/],
 ['הרב לייבל אלטיין',/לייבל\s+אלטיין/],
 ['הרב שמואל שור',/שמואל\s+שור/],
 ['ר׳ יוסף קליין',/יוסף\s+קליין/],
 ['הרב יוסף יצחק גורארי׳',/יוסף\s+יצחק\s+גורארי/],
 ['הרב יוסף יצחק פלטיאל',/יוסף\s+יצחק\s+פלטיאל/],
 ['הרב לימא וליהלם',/לימא\s+וליהלם/],
 ['ר׳ שלום חאריטאנאוו',/שלום\s+חאריטאנאוו/]
];
function getSeries(v){if(clean(v.series))return clean(v.series);if(clean(v.topic))return clean(v.topic);for(const [name,re] of seriesRules)if(re.test(v.title))return name;return 'סדרה לא צוינה'}
function getSpeaker(v){const explicit=clean(v.speaker)||clean(v.rabbi)||clean(v.maggid_shiur);if(explicit)return explicit;for(const [name,re] of speakerRules)if(re.test(v.title))return name;return 'מגיד שיעור לא צוין'}
function fillOptions(el,values){for(const value of [...new Set(values)].sort((a,b)=>a.localeCompare(b,'he'))){const opt=document.createElement('option');opt.value=value;opt.textContent=value;el.append(opt)}}
function render(){const q=normalize(search.value);const matched=videos.filter(v=>(!q||normalize(v.title+' '+getSpeaker(v)+' '+getSeries(v)).includes(q))&&(!speaker.value||getSpeaker(v)===speaker.value)&&(!series.value||getSeries(v)===series.value));if(sort.value==='old')matched.reverse();else if(sort.value==='az')matched.sort((a,b)=>a.title.localeCompare(b.title,'he'));grid.replaceChildren();for(const v of matched.slice(0,visible)){const card=document.createElement('article');card.className='card';const btn=document.createElement('button');btn.className='thumb';btn.setAttribute('aria-label','נגן '+v.title);const img=document.createElement('img');img.loading='lazy';img.alt='';img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';const play=document.createElement('span');play.className='play';play.textContent='▶';btn.append(img,play);btn.addEventListener('click',()=>{const iframe=document.createElement('iframe');iframe.className='player';iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1';iframe.title=v.title;iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;btn.replaceWith(iframe)});const h=document.createElement('h2');h.textContent=v.title;card.append(btn,h);grid.append(card)}load.hidden=matched.length<=visible;status.textContent=matched.length?`מוצגים ${Math.min(visible,matched.length)} מתוך ${matched.length} שיעורים`:'לא נמצאו שיעורים מתאימים.'}
for(const el of [search,speaker,series,sort])el.addEventListener(el===search?'input':'change',()=>{visible=24;render()});load.addEventListener('click',()=>{visible+=24;render()});
fetch('./videos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Video index not available');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid video index');videos=data.filter(v=>v&&typeof v.id==='string'&&/^[\w-]{11}$/.test(v.id)&&typeof v.title==='string');fillOptions(speaker,videos.map(getSpeaker));fillOptions(series,videos.map(getSeries));render()}).catch(()=>{status.textContent='לא ניתן לטעון את ספריית השיעורים כרגע.'});
</script></body></html>
