<body><main><h1>ספריית השיעורים - בית מנחם</h1><p class="subtitle">שיעורים והתוועדויות בבית מדרשינו</p>
<div id="featured" class="featured-grid" aria-label="שיעורים אחרונים" hidden></div>
<div class="filters">
<div class="field field-search"><label for="search">חיפוש שיעורים</label><input id="search" type="search" placeholder="חיפוש לפי שם השיעור או מילת מפתח…"></div>
<div class="field"><label for="speaker">מגיד שיעור</label><select id="speaker"><option value="">כל מגידי השיעורים</option></select></div>
<div class="field"><label for="topic">סדרת שיעורים</label><select id="topic"><option value="">כל הסדרות</option></select></div>
<div class="field"><label for="sort">מיון לפי</label><select id="sort"><option value="new">מהחדש לישן</option><option value="old">מהישן לחדש</option><option value="az">לפי כותרת</option></select></div>
</div><div id="grid" class="grid"></div><p id="status" role="status">טוען שיעורים…</p><button id="load" hidden>טען שיעורים נוספים</button></main>
<script>
// Public video metadata is generated by GitHub Actions; API credentials are not used here.
const grid=document.getElementById('grid'),search=document.getElementById('search'),status=document.getElementById('status'),load=document.getElementById('load'),speaker=document.getElementById('speaker'),topic=document.getElementById('topic'),sort=document.getElementById('sort');
let videos=[],visible=24;
const clean=s=>typeof s==='string'?s.trim():'';
const norm=s=>clean(s).toLocaleLowerCase('he').replace(/[\u05f3\u05f4׳״'"`]/g,'').replace(/[־–—-]/g,' ').replace(/\s+/g,' ').trim();
const knownSpeakers=[
 ['הרב יעקב פרץ בלומינג',/יעקב\s+(?:פרץ\s+)?בלומינג/],
 ['הרב לייבל אלטיין',/לייבל\s+אלטיין/],
 ['הרב שמואל שור',/שמואל\s+שור/],
 ['הרב יוסף קליין',/יוסף\s+קליין/],
 ['הרב יוסף יצחק גורארי׳',/יוסף\s+יצחק\s+גורארי/],
 ['הרב יוסף יצחק פלטיאל',/יוסף\s+יצחק\s+פלטיאל/],
 ['הרב לימא וליהלם',/לימא\s+וליהלם/],
 ['הרב שלום חאריטאנאוו',/שלום\s+חאריטאנאוו/]
];
const UNKNOWN_SPEAKER='לא צוין מגיד שיעור';
// Names explicitly supplied in titles or metadata are discovered automatically.
// Keep known aliases first, so spelling variants merge into one rabbi.
function canonicalSpeaker(s){
 const n=norm(s);
 for(const [name,re] of knownSpeakers)if(re.test(n))return name;
 const stripped=clean(s).replace(/^(?:(?:מפי|ע״י|על ידי)\s+)?(?:הרה״ג|הרה״ח|הרב|רבי|רב|ר['׳״\u05f3\u05f4]?)\s+/u,'').trim();
 const words=stripped.split(/\s+/).filter(Boolean);
 if(words.length<2||words.length>5)return UNKNOWN_SPEAKER;
 return 'הרב '+stripped;
}
function extractLabeledSpeaker(title){
 // Match only explicit speaker labels. Stop at separators or common title context.
 const sections=title.split(/\s*(?:\||[–—]|\s[-]\s|[;]|\n)\s*/u);
 const marker=/(?:^|\s)(?:(?:מפי|ע״י|על ידי)\s+)?(?:הרה״ג|הרה״ח|הרב|רבי|רב|ר['׳״\u05f3\u05f4]?)\s+([\u05d0-\u05ea][\u05d0-\u05ea'׳״\u05f3\u05f4\s-]*)/u;
 const stop=/\s+(?:שליט[״']?א|זצ[״']?ל|בנושא|בעניין|על|בשיעור|בשיחת|בפרשת|פרשת|שיעור|התוועדות|יום|ליל|מוצאי|תאריך|תש[\u05d0-\u05ea]+)\b/u;
 for(const section of sections){
  const m=section.match(marker);if(!m)continue;
  const tail=m[1].split(stop)[0].trim();
  const words=tail.split(/\s+/).filter(Boolean);
  if(words.length>=2&&words.length<=5)return canonicalSpeaker(tail);
 }
 return UNKNOWN_SPEAKER;
}
function getSpeaker(v){
 if(clean(v.speaker))return clean(v.speaker); // Explicit Google Sheets override
 for(const field of [v.rabbi,v.maggid_shiur])if(clean(field)){
  const candidate=canonicalSpeaker(field);if(candidate!==UNKNOWN_SPEAKER)return candidate;
 }
 const title=clean(v.title),n=norm(title);
 // Confirmed series-to-speaker association, including future uploads.
 if(/רמבם\s+לעיונא/u.test(n))return 'הרב יעקב פרץ בלומינג';
 for(const [name,re] of knownSpeakers)if(re.test(n))return name;
 return extractLabeledSpeaker(title);
}
// A comma, Hebrew comma, semicolon, or line break separates co-presenters.
// Manual names are kept as entered in Google Sheets.
function getSpeakers(v){
 const raw=getSpeaker(v);
 const names=raw.split(/[,،;؛\n]+/u).map(clean).filter(Boolean);
 return [...new Set(names.length?names:[UNKNOWN_SPEAKER])];
}
const seriesRules=[
 ['היום יום',/היום\s+יום/],['דרך מצוותיך',/דרך\s+מצוותיך/],['לקוטי שיחות',/(?:לקוטי|ליקוטי)\s+שיחות/],['רמב״ם לעיונא',/רמב["״׳']?ם\s+לעיונא/u],['ספר השיחות',/ספר\s+השיחות/],['תניא',/תניא/],['מאמרים',/מאמר(?:ים)?\b/],['התוועדויות',/התוועדות|התוועדויות/],['פרשת השבוע',/פרשת|פרשה/]
];
function getSeries(v){if(clean(v.series))return clean(v.series);if(clean(v.topic))return clean(v.topic);for(const [name,re] of seriesRules)if(re.test(v.title))return name;return 'שיעורים נוספים'}
function fillOptions(el,values){for(const value of [...new Set(values)].sort((a,b)=>a.localeCompare(b,'he'))){const opt=document.createElement('option');opt.value=value;opt.textContent=value;el.append(opt)}}

// Categorize by explicit series or title, not by upload date.
function isFarbrengen(v){
 return /התוועדות|התוועדויות/u.test(clean(v._series)+' '+clean(v.title));
}

// One shared floating player; the video starts only when requested.
const videoModal=document.createElement('div');
videoModal.className='video-modal';videoModal.hidden=true;
videoModal.setAttribute('role','dialog');videoModal.setAttribute('aria-modal','true');
videoModal.setAttribute('aria-label','Video player');
const videoDialog=document.createElement('div');videoDialog.className='video-dialog';
const videoHeader=document.createElement('div');videoHeader.className='video-modal-header';
const videoTitle=document.createElement('h2');videoTitle.className='video-modal-title';
const videoClose=document.createElement('button');videoClose.type='button';videoClose.className='video-modal-close';videoClose.textContent='✕ Close';
const videoStage=document.createElement('div');
videoHeader.append(videoTitle,videoClose);videoDialog.append(videoHeader,videoStage);videoModal.append(videoDialog);
document.body.append(videoModal);
let previousVideoFocus=null;
function closeVideoPlayer(){
 if(videoModal.hidden)return;
 videoModal.hidden=true;videoStage.replaceChildren();document.body.classList.remove('video-modal-open');
 if(previousVideoFocus&&previousVideoFocus.isConnected)previousVideoFocus.focus();
}
function openVideoPlayer(button,v){
 previousVideoFocus=button;
 // Google Sites may show only part of a tall iframe on mobile.
 // Position the player at the tapped card instead of the iframe's top.
 if(window.matchMedia('(max-width:520px)').matches){
  const tappedTop=button.getBoundingClientRect().top+window.scrollY;
  const dialogHeight=Math.min(window.innerWidth*9/16+60,450);
  const pageHeight=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);
  const top=Math.max(8,Math.min(tappedTop-12,pageHeight-dialogHeight-12));
  videoModal.style.setProperty('--mobile-player-top',top+'px');
 }else videoModal.style.removeProperty('--mobile-player-top');
 videoStage.replaceChildren();videoTitle.textContent=v.title;
 const iframe=document.createElement('iframe');iframe.className='video-modal-frame';
 iframe.src='https://www.youtube.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1';
 iframe.title=v.title;iframe.referrerPolicy='strict-origin-when-cross-origin';
 iframe.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';iframe.allowFullscreen=true;
 videoStage.append(iframe);videoModal.hidden=false;document.body.classList.add('video-modal-open');
 videoClose.focus({preventScroll:true});
 if(window.matchMedia('(max-width:520px)').matches){
  requestAnimationFrame(()=>videoDialog.scrollIntoView({block:'start',behavior:'instant'}));
 }
}
videoClose.addEventListener('click',closeVideoPlayer);
videoModal.addEventListener('click',e=>{if(e.target===videoModal)closeVideoPlayer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!videoModal.hidden)closeVideoPlayer()});

function makeFeaturedCard(v,headingLabel){
 const section=document.createElement('section');section.className='featured-section';
 section.setAttribute('aria-label',headingLabel);
 const heading=document.createElement('div');heading.className='featured-heading';
 const headingText=document.createElement('h2');headingText.textContent=headingLabel;
 const badge=document.createElement('span');badge.className='featured-badge';badge.textContent='חדש באתר';
 heading.append(headingText,badge);
 const card=document.createElement('article');card.className='featured-card';
 const media=document.createElement('div');media.className='featured-media';
 const thumb=document.createElement('button');thumb.type='button';thumb.className='thumb';thumb.setAttribute('aria-label','נגן '+v.title);
 const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';img.alt='';
 const play=document.createElement('span');play.className='play';play.textContent='▶';play.setAttribute('aria-hidden','true');thumb.append(img,play);
 thumb.addEventListener('click',()=>openVideoPlayer(thumb,v));
 media.append(thumb);
 const details=document.createElement('div');details.className='featured-details';
 if(v._series&&v._series!=='שיעורים נוספים'){const tag=document.createElement('span');tag.className='series-tag';tag.textContent=v._series;details.append(tag)}
 const title=document.createElement('h3');title.textContent=v.title;details.append(title);
 if(v._speakers.some(name=>name!==UNKNOWN_SPEAKER)){const names=document.createElement('div');names.className='featured-speakers';names.textContent='♙ '+v._speakers.join(' · ');details.append(names)}
 const watch=document.createElement('button');watch.type='button';watch.className='featured-watch';watch.textContent='לצפייה ◀';watch.addEventListener('click',()=>openVideoPlayer(watch,v));details.append(watch);
 card.append(media,details);section.append(heading,card);
 return section;
}
function renderFeatured(){
 const container=document.getElementById('featured');container.replaceChildren();
 // videos.json is ordered newest first. Hidden videos have already been excluded.
 const shiur=videos.find(v=>!isFarbrengen(v));
 const farbrengen=videos.find(v=>isFarbrengen(v)&&v.id!==shiur?.id);
 if(shiur)container.append(makeFeaturedCard(shiur,'השיעור האחרון'));
 if(farbrengen)container.append(makeFeaturedCard(farbrengen,'ההתוועדות האחרונה'));
 container.hidden=!container.childElementCount;
}

function render(){
 const q=norm(search.value);
 const matched=videos.filter(v=>(!q||norm(v.title+' '+v._speakers.join(' ')+' '+v._series).includes(q))&&(!speaker.value||v._speakers.includes(speaker.value))&&(!topic.value||v._series===topic.value));
 if(sort.value==='old')matched.reverse();else if(sort.value==='az')matched.sort((a,b)=>a.title.localeCompare(b.title,'he'));
 grid.replaceChildren();
 for(const v of matched.slice(0,visible)){
  const card=document.createElement('article');card.className='card';
  const btn=document.createElement('button');btn.className='thumb';btn.type='button';btn.setAttribute('aria-label','נגן '+v.title);
  const img=document.createElement('img');img.loading='lazy';img.alt='';img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';
  const play=document.createElement('span');play.className='play';play.setAttribute('aria-hidden','true');play.textContent='▶';btn.append(img,play);
  btn.addEventListener('click',()=>openVideoPlayer(btn,v));
  const body=document.createElement('div');body.className='card-body';
  if(v._series&&v._series!=='שיעורים נוספים'){const meta=document.createElement('div');meta.className='card-meta';const tag=document.createElement('span');tag.className='series-tag';tag.textContent=v._series;meta.append(tag);body.append(meta)}
  const h=document.createElement('h2');h.textContent=v.title;h.title=v.title;body.append(h);
  if(v._speakers.some(name=>name!==UNKNOWN_SPEAKER)){const speakerRow=document.createElement('div');speakerRow.className='speaker-name';const icon=document.createElement('span');icon.className='speaker-icon';icon.setAttribute('aria-hidden','true');icon.textContent='♙';const name=document.createElement('span');name.textContent=v._speakers.join(' · ');speakerRow.append(icon,name);body.append(speakerRow)}
  const footer=document.createElement('div');footer.className='card-footer';const institution=document.createElement('span');institution.textContent='בית מנחם ליובאוויטש';const watch=document.createElement('button');watch.type='button';watch.className='watch-label';watch.textContent='לצפייה ◀';watch.setAttribute('aria-label','לצפייה: '+v.title);watch.addEventListener('click',()=>openVideoPlayer(watch,v));footer.append(institution,watch);body.append(footer);
  card.append(btn,body);grid.append(card);
 }
 load.hidden=matched.length<=visible;status.textContent=matched.length?`${Math.min(visible,matched.length)} מתוך ${matched.length} שיעורים`:'לא נמצאו שיעורים מתאימים';
}
for(const el of [search,speaker,topic,sort])el.addEventListener(el===search?'input':'change',()=>{visible=24;render()});load.addEventListener('click',()=>{visible+=24;render()});
fetch('./videos.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Video index not available');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid video index');videos=data.filter(v=>v&&v.hidden!==true&&typeof v.id==='string'&&/^[\w-]{11}$/.test(v.id)&&typeof v.title==='string').map(v=>({...v,_speakers:getSpeakers(v),_series:getSeries(v)}));fillOptions(speaker,videos.flatMap(v=>v._speakers));fillOptions(topic,videos.map(v=>v._series));renderFeatured();render()}).catch(()=>{status.textContent='לא ניתן לטעון את ספריית השיעורים כעת.'});
